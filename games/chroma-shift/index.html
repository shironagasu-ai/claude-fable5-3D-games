<style>
  :root { --bg: #07070d; --panel: #12121e; --line: #2a2a40; --text: #d8d8e8; --dim: #8888a0; }

  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);

  #app { height: 100dvh; display: flex; flex-direction: column; }
  header { height: 44px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 10px;
    border-bottom: 1px solid var(--line); background: var(--panel); position: relative; }

  header h1 b:nth-child(1) { color: #ff5a5a; } header h1 b:nth-child(2) { color: #5aff7a; } header h1 b:nth-child(3) { color: #6a8cff; }

  .film.locked::after { content: "LOCK"; bottom: auto; top: 50%; height: auto; left: 0; right: 0; transform: translateY(14px) rotate(-12deg);

<body>

<script type="module">
import * as THREE from '../../vendor/three-0.170.0.module.min.js';

/*CORE-BEGIN*/
// ---- 規則（描画に依存しない純関数。tests からもこの区間を読み込む） ----
// 色は 3 ビット: 赤=1, 緑=2, 青=4。3 層が重なった白(7)のマスだけ歩ける。
// 層は 1 マスずつずらせる。ただし自分の足元が白のままになる場合だけ。
// クリスタルは、そのマスが指定色とちょうど同じになったら点灯し、以後は消えない。
function parseLevel(d) {
  const w = d.rows[0].length, h = d.rows.length;
  const base = new Uint8Array(w * h);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) base[y * w + x] = +d.rows[y][x];
  return {
    w, h, base, M: d.M ?? 2,
    mov: ['R', 'G', 'B'].map(c => d.mov.includes(c)),
    off0: d.off.flat(), start: d.start, exit: d.exit,
    cry: (d.cry || []).map(c => ({ x: c[0], y: c[1], k: c[2] })),
    par: d.par || 0, tip: d.tip || '',
  };
}
function colorAt(L, off, x, y) {
  if (x < 0 || y < 0 || x >= L.w || y >= L.h) return 0;
  let c = 0;
  for (let i = 0; i < 3; i++) {
    const sx = x - off[i * 2], sy = y - off[i * 2 + 1];
    if (sx >= 0 && sy >= 0 && sx < L.w && sy < L.h && (L.base[sy * L.w + sx] >> i & 1)) c |= 1 << i;
  }
  return c;
}
function litMask(L, off, lit) {
  L.cry.forEach((c, i) => { if (colorAt(L, off, c.x, c.y) === c.k) lit |= 1 << i; });
  return lit;
}
function initState(L) {
  const off = L.off0.slice();
  return { px: L.start[0], py: L.start[1], off, lit: litMask(L, off, 0) };
}
function stepPlayer(L, s, dx, dy) {
  const x = s.px + dx, y = s.py + dy;
  if (colorAt(L, s.off, x, y) !== 7) return 'wall';
  return { px: x, py: y, off: s.off, lit: s.lit };
}
function stepLayer(L, s, c, dx, dy) {
  if (!L.mov[c]) return 'lock';
  const off = s.off.slice();
  off[c * 2] += dx; off[c * 2 + 1] += dy;
  if (Math.abs(off[c * 2]) > L.M || Math.abs(off[c * 2 + 1]) > L.M) return 'limit';
  if (colorAt(L, off, s.px, s.py) !== 7) return 'foot';
  return { px: s.px, py: s.py, off, lit: litMask(L, off, s.lit) };
}
function isClear(L, s) {
  return s.px === L.exit[0] && s.py === L.exit[1] && s.lit === (1 << L.cry.length) - 1;
}
function keyOf(s) {
  let k = s.lit;
  for (let i = 0; i < 6; i++) k = k * 7 + (s.off[i] + 3);
  return (k * 16 + s.px) * 16 + s.py;
}
// ずらし回数が最小の手順を探す（歩きはコスト 0、ずらしはコスト 1 の幅優先探索）
function solve(L, s0, cap) {
  cap = cap || 400000;
  const DIRS = [[1, 0], [-1, 0], [0, 1], [0, -1]];
  const par = new Map();
  let cur = [[s0, null, null]], next = [], n = 0, goal = null;
  while (cur.length && goal === null) {
    for (let i = 0; i < cur.length; i++) {
      const [s, pk, act] = cur[i];
      const k = keyOf(s);
      if (par.has(k)) continue;
      par.set(k, [pk, act]);
      if (++n > cap) return null;
      if (isClear(L, s)) { goal = k; break; }
      for (const [dx, dy] of DIRS) {
        const t = stepPlayer(L, s, dx, dy);
        if (typeof t === 'object' && !par.has(keyOf(t))) cur.push([t, k, { t: 'm', dx, dy }]);
        for (let c = 0; c < 3; c++) {
          const u = stepLayer(L, s, c, dx, dy);
          if (typeof u === 'object' && !par.has(keyOf(u))) next.push([u, k, { t: 's', c, dx, dy }]);
        }
      }
    }
    cur = next; next = [];
  }
  if (goal === null) return null;
  const acts = [];
  for (let k = goal; par.get(k)[1]; k = par.get(k)[0]) acts.push(par.get(k)[1]);
  acts.reverse();
  return { acts, shifts: acts.filter(a => a.t === 's').length, states: n };
}

const LEVELS = [
/*LEVELS-BEGIN*/
{ rows: ["7020102","7750077","0771077","0077777"], M: 2, mov: 'R', off: [[1,-1],[0,0],[0,0]], start: [6,2], exit: [0,1], cry: [], par: 2, tip: '赤の層だけ動かせる。R（キー 1）を選んで矢印でずらし、白い道をつなげよう' },
{ rows: ["00420000","47640477","47700777","04700777","34777777"], M: 2, mov: 'RG', off: [[1,-1],[-1,2],[0,0]], start: [5,3], exit: [0,1], cry: [], par: 5, tip: '緑の層も動かせる。自分の足元が白でなくなる向きにはずらせない' },
{ rows: ["777777704","740100001","771007010","777777006","777777211","774000151"], M: 2, mov: 'RGB', off: [[-1,2],[1,1],[-1,1]], start: [1,5], exit: [5,0], cry: [], par: 6, tip: '3 色すべて動かせる。迷ったら HINT（H キー）' },
{ rows: ["770640110","770000004","770127770","774014770","770777745","777777020"], M: 2, mov: 'RG', off: [[0,1],[-2,1],[0,0]], start: [4,4], exit: [0,1], cry: [[8,5,3]], par: 6, tip: '◆クリスタル: そのマスの色が印の色（Y=赤+緑 M=赤+青 C=緑+青）になると点灯。全部点灯で出口が開く' },
{ rows: ["0414602047","2141624437","0252000107","0000000407","7777720777","7777777777","7777777703"], M: 2, mov: 'RGB', off: [[2,0],[2,0],[1,-2]], start: [3,4], exit: [8,0], cry: [], par: 9 },
{ rows: ["2230002060","2414000004","0000300073","2770004772","7774710777","7777707777","7777777777"], M: 2, mov: 'RGB', off: [[-2,-2],[-1,0],[-1,1]], start: [1,4], exit: [9,1], cry: [[4,1,3]], par: 10 },
{ rows: ["00007777777","04057777777","00457777777","27777774070","07777774060","27000002000","24304106045"], M: 2, mov: 'RGB', off: [[2,-2],[-1,-2],[2,2]], start: [8,2], exit: [0,2], cry: [[7,3,5],[0,3,5]], par: 11 },
{ rows: ["020413004420","200100007774","010164607777","047720140777","177742017775","777737777264","777777277001","177777071020"], M: 2, mov: 'RGB', off: [[0,-2],[-2,-2],[-2,0]], start: [3,5], exit: [10,7], cry: [], par: 13 },
{ rows: ["122156710103","204200164000","777777040043","770407700001","721407777770","740077777771","777414777777","703400577771"], M: 2, mov: 'RGB', off: [[0,-1],[1,2],[1,-2]], start: [4,4], exit: [11,3], cry: [[5,0,3],[6,5,6]], par: 14 },
/*LEVELS-END*/
];
/*CORE-END*/

// ---- 定数 ----
const RW = 256, RH = 192, CELL = 16, FIELD_Y = 22, FIELD_H = 144;
const NAMES = ['赤', '緑', '青'], ARROW = { '1,0': '→', '-1,0': '←', '0,1': '↓', '0,-1': '↑' };
const CRY_COL = { 3: '#ffe24a', 5: '#ff5ae0', 6: '#4ae8ff' }, CRY_CH = { 3: 'Y', 5: 'M', 6: 'C' };
const FX_PRESETS = {
  crt: { bloom: 1, scan: 1, mask: 1, curve: 1, ab: 1, noise: 1, dither: 0 },
  soft: { bloom: 1, scan: 0, mask: 0, curve: 0, ab: 1, noise: 0, dither: 0 },
  raw: { bloom: 0, scan: 0, mask: 0, curve: 0, ab: 0, noise: 0, dither: 0 },
};

// ---- 保存 ----
const SAVE_KEY = 'chroma-shift-v1';
let save = { unlocked: 1, best: {}, fx: { ...FX_PRESETS.crt }, mute: false };
try { Object.assign(save, JSON.parse(localStorage.getItem(SAVE_KEY) || '{}')); } catch (e) {}
const persist = () => { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {} };

// ---- 音（矩形波の短い音だけ） ----
let actx = null;
function beep(freq, dur, opt = {}) {
  if (save.mute) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    const t = actx.currentTime + (opt.delay || 0);
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = opt.type || 'square';
    o.frequency.setValueAtTime(freq, t);
    if (opt.to) o.frequency.exponentialRampToValueAtTime(opt.to, t + dur);
    g.gain.setValueAtTime(opt.vol || 0.05, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(actx.destination);
    o.start(t); o.stop(t + dur + 0.02);
  } catch (e) {}
}

// ---- ゲーム状態 ----
let li = 0, L = null, S = null, hist = [], shifts = 0, mode = 'title', sel = -1, clearAt = 0;
const disp = { off: [0, 0, 0, 0, 0, 0], px: 0, py: 0 };
const fxs = { abx: 0, aby: 0, shake: 0, flash: 0 };
const $ = id => document.getElementById(id);
const msgEl = $('msg');
function setMsg(text, cls) { msgEl.textContent = text; msgEl.className = cls || ''; }

function loadLevel(i, keepMode) {
  li = Math.max(0, Math.min(LEVELS.length - 1, i));
  L = parseLevel(LEVELS[li]);
  S = initState(L); hist = []; shifts = 0; sel = -1;
  disp.off = S.off.slice(); disp.px = S.px; disp.py = S.py;
  if (!keepMode) mode = 'play';
  uploadMask();
  refreshUI();
  setMsg(L.tip || '白いマスだけ歩ける。層をずらして出口までの道を作ろう');
}

      // 自分を操作中: 脈打つ四隅の枠と、歩ける方向の矢印
      const e = Math.floor(time * 4) % 2 ? 2 : 3, x0 = pxl - e, y0 = pyl - e, sz = CELL + 2 * e;
      for (const [col, d, t] of [['#05050c', -1, 4], ['#ffffff', 0, 2]]) {   // 黒い縁取り + 太さ 2px の白枠
        g2.fillStyle = col;
        for (const [cx, cy, sx, sy] of [[x0, y0, 1, 1], [x0 + sz, y0, -1, 1], [x0, y0 + sz, 1, -1], [x0 + sz, y0 + sz, -1, -1]]) {
          const L6 = 6 + t - 2;
          g2.fillRect(sx > 0 ? cx + d : cx - L6 - d, sy > 0 ? cy + d : cy - t - d, L6, t);
          g2.fillRect(sx > 0 ? cx + d : cx - t - d, sy > 0 ? cy + d : cy - L6 - d, t, L6);
        }
      }
      {
        g2.fillStyle = Math.floor(time * 4) % 2 ? '#14142c' : '#5a5a80';
        for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
          if (typeof stepPlayer(L, S, dx, dy) !== 'object') continue;
          const cx = ox + (S.px + dx) * CELL + 8 - dx, cy = oy + (S.py + dy) * CELL + 8 - dy;
          for (let i = -2; i <= 2; i++) for (let t = 0; t < 2; t++) {
            const a = 2 - Math.abs(i) - t;
            g2.fillRect(cx + dx * a + (dy ? i : 0), cy + dy * a + (dx ? i : 0), 1, 1);
          }
        }
      }
    }
    sprite(PLAYER, pxl + 2, pyl + 2 - bob, { '#': youSel ? '#05050c' : '#3a3a58', o: youSel ? ['#ff4a4a', '#4aff6a', '#6a8cff'][Math.floor(time * 6) % 3] : '#c8c8dc' });
    // 上の表示
    text('STAGE ' + String(li + 1).padStart(2, '0'), 6, 5, 2, '#e8e8f8');
    const sh = 'SHIFT ' + String(shifts).padStart(2, '0');
    text(sh, RW - 6 - textW(sh, 2), 3, 2, shifts > L.par ? '#ffb060' : '#e8e8f8');
    const b = save.best[li];
    const pr = 'PAR ' + L.par + (b !== undefined ? '  BEST ' + b : '');
    text(pr, RW - 6 - textW(pr, 1), 15, 1, '#8c8ca8');
    // 下の表示: 操作対象
    const items = [['YOU', -1, '#e8e8f8'], ['R', 0, '#ff5a5a'], ['G', 1, '#5aff7a'], ['B', 2, '#6a8cff']];
    let x = 6;
    for (const [label, t, colr] of items) {
      const w = textW(label, 2) + 8, on = t === sel, locked = t >= 0 && !L.mov[t];
      g2.fillStyle = on ? colr : '#16162a'; g2.fillRect(x, 171, w, 16);
      text(label, x + 4, 174, 2, on ? '#0c0c18' : (locked ? '#3a3a50' : colr));
      if (on && Math.floor(time * 3) % 2) { g2.fillStyle = colr; g2.fillRect(x, 189, w, 1); }
      x += w + 4;
    }
    if (L.cry.length) {
      let cx = RW - 12;
      for (let i = L.cry.length - 1; i >= 0; i--) { diamond(cx, 179, 5, CRY_COL[L.cry[i].k]); diamond(cx, 179, 3, (S.lit >> i & 1) ? '#ffffff' : '#0c0c18'); cx -= 14; }
    } else text('Z:UNDO R:RESET H:HINT', RW - 6 - textW('Z:UNDO R:RESET H:HINT', 1), 177, 1, '#5c5c78');
  }
  if (mode === 'title') {
    const s = 3, str = 'CHROMA SHIFT', x0 = Math.round((RW - textW(str, s)) / 2), y0 = 60;
    const k = Math.max(0, 1 - time / 1.6), wob = Math.sin(time * 1.3) * 1.5;
    g2.globalCompositeOperation = 'lighter';
    text(str, x0 - Math.round(k * 40 + 1 + wob), y0, s, '#ff0000');
    text(str, x0, y0 + Math.round(k * 30), s, '#00ff00');
    text(str, x0 + Math.round(k * 40 + 1 + wob), y0, s, '#0000ff');
    g2.globalCompositeOperation = 'source-over';
    textC('R + G + B = WHITE', 90, 1, '#a8a8c0');
    if (Math.floor(time * 2) % 2) textC('PRESS ANY KEY / TAP', 122, 2, '#ffffff');
    textC('STAGE ' + Math.min(save.unlocked, LEVELS.length) + ' / ' + LEVELS.length, 150, 1, '#8c8ca8');
  }
  if (mode === 'clear' && now() - clearAt > 250) {
    g2.fillStyle = 'rgba(8,8,20,0.88)'; g2.fillRect(38, 64, 180, 62);
    g2.fillStyle = '#e8e8f8'; g2.fillRect(38, 64, 180, 1); g2.fillRect(38, 125, 180, 1);
    const last = li + 1 >= LEVELS.length;
    textC(last ? 'ALL CLEAR!' : 'STAGE CLEAR', 72, 3, '#ffffff');
    textC('SHIFT ' + shifts + '   PAR ' + L.par + (shifts <= L.par ? '  *' : ''), 96, 2, shifts <= L.par ? '#ffe24a' : '#c8c8dc');
    if (Math.floor(time * 2) % 2) textC(last ? 'ENTER: TITLE' : 'ENTER: NEXT', 114, 1, '#a8a8c0');
  }
  ovTex.needsUpdate = true;
}

// ---- ループ ----
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = Math.max(1, Math.round(canvas.clientWidth * dpr)), h = Math.max(1, Math.round(canvas.clientHeight * dpr));
  if (canvas.width !== w || canvas.height !== h) renderer.setSize(w, h, false);
  finalMat.uniforms.uOut.value.set(w, h);
}
function pass(mat, target) { quad.material = mat; renderer.setRenderTarget(target); renderer.render(scene, cam); }
let last = performance.now(), time = 0, frames = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; time += dt; frames++;
  const k = 1 - Math.exp(-dt * 24);
  for (let i = 0; i < 6; i++) { disp.off[i] += (S.off[i] - disp.off[i]) * k; if (Math.abs(S.off[i] - disp.off[i]) < 0.02) disp.off[i] = S.off[i]; }
  disp.px += (S.px - disp.px) * k; disp.py += (S.py - disp.py) * k;
  const decay = Math.exp(-dt * 9);
  fxs.abx *= decay; fxs.aby *= decay; fxs.shake *= Math.exp(-dt * 14); fxs.flash *= Math.exp(-dt * 6);
  resize();
  drawOverlay(time);
  const wu = worldMat.uniforms, fu = finalMat.uniforms, fx = save.fx;
  for (let c = 0; c < 3; c++) wu.uOff.value[c].set(Math.round(disp.off[c * 2] * CELL) / CELL, Math.round(disp.off[c * 2 + 1] * CELL) / CELL);
  wu.uTime.value = time; wu.uSel.value = mode === 'play' ? sel : -1; wu.uDither.value = fx.dither ? 1 : 0;
  wu.uFlash.value = fxs.flash; wu.uDim.value = mode === 'title' ? 0.12 : 1;
  pass(worldMat, rtScene);
  blurMat.uniforms.tSrc.value = rtScene.texture; blurMat.uniforms.uDir.value.set(1.4 / RW, 0); blurMat.uniforms.uThr.value = 0.35; pass(blurMat, rtA);
  blurMat.uniforms.tSrc.value = rtA.texture; blurMat.uniforms.uDir.value.set(0, 1.4 / RH); blurMat.uniforms.uThr.value = 0; pass(blurMat, rtB);
  fu.uTime.value = time;
  fu.uCurve.value = fx.curve ? 0.07 : 0; fu.uScan.value = fx.scan ? 1 : 0; fu.uMask.value = fx.mask ? 0.5 : 0;
  fu.uBloom.value = fx.bloom ? 0.75 + (mode === 'clear' ? 0.5 : 0) : 0; fu.uNoise.value = fx.noise ? 1 : 0;
  fu.uAb.value = fx.ab ? 1 : 0;
  fu.uAbDir.value.set(fx.ab ? fxs.abx : 0, fx.ab ? -fxs.aby : 0);
  fu.uShake.value.set(Math.sin(time * 90) * fxs.shake * 1.5, 0);
  pass(finalMat, null);
  requestAnimationFrame(frame);
}

// ---- 起動 ----
syncFx(); syncMute();
loadLevel(0, true);
setMsg('3 色の層が重なった白いマスだけ歩ける。層をずらして出口へ');
requestAnimationFrame(frame);

// E2E テスト用
window.__cs = {
  levels: LEVELS.length,
  info: () => ({ li, mode, sel, shifts, px: S.px, py: S.py, off: S.off.slice(), lit: S.lit, par: L.par, frames, unlocked: save.unlocked }),
  solve: () => solve(L, S),
  goto: i => { save.unlocked = Math.max(save.unlocked, i + 1); loadLevel(i); },
  setFx: fx => { Object.assign(save.fx, fx); syncFx(); },
};
</script>
</body>
